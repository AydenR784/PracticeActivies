<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ayden Roddy"> 
    <meta name="description" content="A portfolio showcasing my web development work."> 
    <style>
        .card{
            box-shadow:
            0 1px 2px rgba(0, 0, 0, 0.05),
            0 4px 6px rgba(128, 207, 207, 0.05),
            0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }

        .circle{
            background: radial-gradient(#25eb32 0%, #1e40af 100%)
        }

        .fade{opacity: 0.5;}
        .hidden{visibility: hidden;}
        .gone{ display: none;}

        .button {
            background: blue;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: darkblue;
        }

        .box {
            background-color: #25eb32;
            transform: translate(50px, 100px); /* Move */
            transform: rotate(45deg); /* Rotate */
            transform: scale(1.5); /* Grow */
            transform: skew(10deg, 5deg); /* Slant */
            transform-origin: top left;
            transform: rotate(45deg);
        }   
    </style>
</head>

<body>
    <div class="card">
        <h1 class="fade">SOME</h1>
        <p>Words</p>
    </div>

    <div class="header">
        <h1>SOME MORE</h1>
        <p>Words</p>
    </div>

    <div class="circle">
        <h1 class="gone">SOME MORE MORE</h1>
        <p>Words</p>
    </div>

    <button class="button">
        Flat Button
    </button>

    <div class="box">
        <h1>SOME MORE MORE MORE</h1>
        <p>Words</p>
    </div>
</body>
</html>
